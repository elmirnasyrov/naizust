# Обновление чарта для «Наизусть»: раз в сутки GitHub сам запускает fetch.py
# и сохраняет свежий data.json в репозиторий. Сайт на GitHub Pages подхватывает его сам.
name: Обновить чарт

on:
  schedule:
    # Время в UTC. 04:37 UTC = 07:37 по Москве (МСК = UTC+3), каждый день.
    # Минуты не круглые: в начале часа у GitHub очередь, запуск опаздывает сильнее.
    - cron: "37 4 * * *"
  workflow_dispatch: # кнопка «Run workflow» в разделе Actions для ручного запуска

permissions:
  contents: write # разрешение сохранить data.json в репозиторий

concurrency:
  group: update-chart # два запуска сразу не идут, второй ждёт первого

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Взять код репозитория
        uses: actions/checkout@v4

      - name: Собрать чарт (fetch.py)
        run: python3 fetch.py

      - name: Сохранить data.json, если он изменился
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "data.json не изменился, сохранять нечего."
          else
            git commit -m "Чарт обновлён автоматически"
            git pull --rebase
            git push
          fi
